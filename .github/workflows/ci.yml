name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only est-spec is public and read by tests (the contract harness).
      # est-pm/est-tcc/est-deploy are private, cross-reference-only, and
      # unreadable by the default GITHUB_TOKEN — do not fetch them here.
      - run: git submodule update --init est-spec

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      # Release & Rollback pipeline gate 2 (infra diff) — synthesizes the
      # candidate CloudFormation template and fails if a stateful resource
      # (Aurora cluster, document bucket) present in the committed
      # main-branch baseline doesn't survive at the same logical ID — the
      # exact shape a Block-ID rename produces. Runs before any sandbox
      # deploy so a rename can never reach one.
      - run: npm run infra-diff

      # Release & Rollback pipeline gate 3 (migration review) — the
      # mechanically checkable core: destructive DDL needs an explicit
      # contract-migration annotation or the pipeline blocks here.
      - run: npm run lint:migrations
